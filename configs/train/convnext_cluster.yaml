# Receita candidata para comparar ConvNeXt no Apuana; desempenho ainda não medido.
# Mesmos dados, entrada e avaliação. Ajustes de memória não mudam a arquitetura.
name: convnext_cluster
dataset: ~/macdeg_data/dataset_1024
splits: splits_nested_seed0.csv
sources: null
other_diseases: true

model: convnext_tiny
pretrained: true
freeze_first_stages: 2
head_init: xavier
# Fixo entre arquiteturas para isolar a troca de variante.
stochastic_depth_prob: 0.1
gradient_checkpointing: true

image_size: 512
batch_size: 16
# 8 microbatches por atualização; mesma escolha para as três arquiteturas.
# O piloto precisa confirmar que cabe na GPU recebida.
micro_batch: 2
epochs: 20
lr: 1.0e-5
head_lr: 1.0e-4
weight_decay: 1.0e-4
exclude_norm_bias_from_weight_decay: true
max_grad_norm: 1.0
warmup_epochs: 1
patience: 5
balance: pos_weight
num_workers: 4
torch_num_threads: 2
cache: true
augment: null
shuffle_labels: false
