# ConvNeXt-Tiny manual com pesos ImageNet-1K e fine-tuning parcial.
# Congela stem + estágios 1 e 2; treina redução para estágio 3, estágios 3/4 e classificador.
name: convnext_tiny_finetuning

dataset: ~/macdeg_data/dataset_1024
splits: splits_nested_seed0.csv
sources: null
other_diseases: true

model: convnext_tiny
pretrained: true
freeze_first_stages: 2
head_init: xavier
image_size: 512
batch_size: 16
epochs: 20
lr: 1.0e-5
head_lr: 1.0e-4
weight_decay: 1.0e-4
warmup_epochs: 1
patience: 5
balance: pos_weight
num_workers: 6

augment: null
shuffle_labels: false
