# A receita de augmentation da rodada2-01 é a mesma em todas as arquiteturas.
# A Tiny com augmentation é o controle. O lote completo tem 80 tarefas.
nome: convnext_arquiteturas_augmentation
base: configs/train/convnext_cluster.yaml
grade:
  model: [convnext_tiny, convnext_small, convnext_base, convnext_large]
  augment:
    - {crop_scale: [0.85, 1.0], hflip: true, rotate_deg: 15, rotate_interpolation: bilinear, color: 0.1}
variacoes: []
referencia: null
